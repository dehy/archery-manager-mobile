# Walkthrough of the signed-in app on a dev build (no relaunch: the dev client keeps its Metro URL).
# Account: user1@ladg.com (licensees Gilles 495732G and Geneviève 636708J), fixtures of season 2027.
# Run: maestro --udid <simulator> test .maestro/walkthrough.yaml --test-output-dir <dir>
appId: net.admds.quiver
---
# Switch licensee: the screens must load the new licensee's data (regression: they used to hang).
- tapOn: "Compte"
- tapOn:
    id: "row-licensee"
- takeScreenshot: 01-licensee-picker
- tapOn:
    id: "licensee-option-495732G"
- takeScreenshot: 02-account

- tapOn: "Accueil"
- extendedWaitUntil:
    visible: "Bonjour Gilles"
    timeout: 15000
- takeScreenshot: 03-home

- tapOn: "Événements"
- extendedWaitUntil:
    visible:
      id: "event-1012"
    timeout: 15000
- takeScreenshot: 04-events
- tapOn:
    id: "event-1012"
- extendedWaitUntil:
    visible: "Ma participation"
    timeout: 15000
- takeScreenshot: 05-event-contest
- scrollUntilVisible:
    element:
      id: "event-participants"
    direction: DOWN
- takeScreenshot: 06-event-contest-bottom
- tapOn:
    id: "event-participants"
- takeScreenshot: 07-participants
- back
- back

- tapOn: "Club"
- extendedWaitUntil:
    visible:
      id: "member-266"
    timeout: 15000
- takeScreenshot: 08-club
- tapOn:
    id: "member-266"
- extendedWaitUntil:
    visible: "Vous n'avez pas accès à ce profil."
    timeout: 15000
- takeScreenshot: 09-profile-forbidden
- back

- tapOn: "Compte"
- tapOn:
    id: "row-results"
- takeScreenshot: 10-results
- back
- tapOn:
    id: "row-advice"
- takeScreenshot: 11-advice
- back
- tapOn:
    id: "row-calendar"
- takeScreenshot: 12-calendar
- back
